<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="320" viewBox="0 0 1120 320" role="img" aria-labelledby="title desc">
  <title id="title">Gabriel Lacerda — Fullstack Developer</title>
  <desc id="desc">From the database to the last pixel. SaaS, e-commerce, and Microsoft 365.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a0a0a"/><stop offset="1" stop-color="#141414"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#f4f4f2" stroke-opacity=".045"/></pattern>
    <clipPath id="frame"><rect width="1120" height="320" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1120" height="320" fill="url(#background)"/>
    <rect width="1120" height="320" fill="url(#grid)"/>
    <circle cx="1050" cy="70" r="240" fill="none" stroke="#a6a69e" stroke-opacity=".1"/>
    <circle cx="1050" cy="70" r="190" fill="none" stroke="#a6a69e" stroke-opacity=".1"/>
    <rect x="48" y="48" width="10" height="10" rx="2" fill="#e5352b"/>
    <text x="70" y="58" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#f4f4f2">FULLSTACK DEVELOPER</text>
    <text x="45" y="142" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="700" letter-spacing="-3" fill="#f4f4f2">Gabriel Lacerda<tspan fill="#e5352b">.</tspan></text>
    <text x="48" y="186" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#a6a69e">From the database to the last pixel.</text>
    <g font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#f4f4f2">
      <rect x="48" y="235" width="88" height="34" rx="17" fill="#2a2a2a"/><text x="92" y="257" text-anchor="middle">SaaS</text>
      <rect x="148" y="235" width="150" height="34" rx="17" fill="#2a2a2a"/><text x="223" y="257" text-anchor="middle">E-commerce</text>
      <rect x="310" y="235" width="168" height="34" rx="17" fill="#2a2a2a"/><text x="394" y="257" text-anchor="middle">Microsoft 365</text>
    </g>
    <g transform="translate(770 52)">
      <path d="M36 70V180H170V90" fill="none" stroke="#e5352b" stroke-width="2" stroke-dasharray="5 7" opacity=".65"/>
      <rect x="80" y="105" width="204" height="116" rx="14" fill="#141414" stroke="#2a2a2a"/>
      <text x="103" y="185" font-family="monospace" font-size="15" letter-spacing="2" fill="#a6a69e">03 / DATA</text>
      <rect x="40" y="54" width="204" height="116" rx="14" fill="#1c1c1c" stroke="#2a2a2a"/>
      <text x="63" y="134" font-family="monospace" font-size="15" letter-spacing="2" fill="#f4f4f2">02 / API</text>
      <rect width="204" height="116" rx="14" fill="#e5352b"/>
      <circle cx="20" cy="20" r="3" fill="#ffffff"/><circle cx="32" cy="20" r="3" fill="#ffffff" opacity=".65"/><circle cx="44" cy="20" r="3" fill="#ffffff" opacity=".4"/>
      <path d="M22 41H182" stroke="#ffffff" stroke-opacity=".4"/>
      <text x="23" y="80" font-family="monospace" font-size="15" letter-spacing="2" fill="#ffffff">01 / INTERFACE</text>
    </g>
    <rect x="0" y="316" width="1120" height="4" fill="#e5352b"/>
